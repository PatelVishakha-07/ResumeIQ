<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account — ResumeIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,560&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#14171F',
          inksoft: '#1D212B',
          paper: '#F5F3EE',
          paperline: '#E3DFD3',
          graphite: '#6B6F76',
          graphitesoft: '#9A9DA3',
          highlighter: '#F2C94C',
          correction: '#3B5BDB',
          correctiondark: '#2A44B8',
          good: '#3C9A5F',
        },
        fontFamily: {
          display: ['"Fraunces"', 'serif'],
          sans: ['"IBM Plex Sans"', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        },
      },
    },
  }
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="font-sans">

<div class="min-h-screen lg:grid lg:grid-cols-5">

  <!-- INK PANEL -->
  <div class="lg:col-span-2 bg-ink text-paper relative overflow-hidden px-8 py-10 sm:px-14 sm:py-14 flex flex-col justify-between">
    <div class="relative z-10">
      <p class="font-mono text-xs tracking-[0.25em] text-highlighter uppercase">ResumeIQ</p>
      <h1 class="font-display text-[2.15rem] sm:text-[2.65rem] leading-[1.08] mt-6 max-w-sm">
        Turn feedback<br/>into a stronger draft.
      </h1>
      <p class="font-sans text-sm text-graphitesoft mt-5 max-w-xs leading-relaxed">
        Create an account to get your first ATS score in minutes.
      </p>
    </div>

    <!-- Signature illustration: resume with upward score trend -->
    <div class="relative z-10 mt-12 hidden sm:block">
      <svg width="280" height="220" viewBox="0 0 280 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="18" y="10" width="180" height="200" rx="6" fill="#1D212B" stroke="#333844" stroke-width="1"/>
        <rect x="36" y="34" width="90" height="10" rx="2" fill="#3A3F4B"/>
        <rect x="36" y="52" width="60" height="7" rx="2" fill="#2C303A"/>
        <rect x="36" y="80" width="144" height="6" rx="2" fill="#2C303A"/>
        <rect x="36" y="94" width="120" height="6" rx="2" fill="#2C303A"/>
        <rect x="36" y="112" width="130" height="6" rx="2" fill="#2C303A"/>
        <rect x="34" y="125" width="126" height="12" fill="#F2C94C" opacity="0.28"/>
        <rect x="36" y="128" width="122" height="6" rx="2" fill="#3A3F4B"/>
        <rect x="36" y="146" width="90" height="6" rx="2" fill="#2C303A"/>

        <ellipse class="mark-circle" cx="88" cy="97" rx="58" ry="10" stroke="#F2C94C" stroke-width="1.6" fill="none"/>

        <!-- upward trend line -->
        <path class="mark-path" d="M206 172 L222 158 L236 166 L256 138" stroke="#3B5BDB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="mark-dot" cx="206" cy="172" r="2.6" fill="#3B5BDB"/>
        <circle class="mark-dot" cx="222" cy="158" r="2.6" fill="#3B5BDB"/>
        <circle class="mark-dot" cx="236" cy="166" r="2.6" fill="#3B5BDB"/>
        <circle class="mark-dot" cx="256" cy="138" r="3.2" fill="#F2C94C"/>
      </svg>
    </div>

    <p class="relative z-10 font-mono text-[11px] tracking-wide text-graphite mt-10">
      Analysis&nbsp;&nbsp;·&nbsp;&nbsp;Interview prep&nbsp;&nbsp;·&nbsp;&nbsp;Version history
    </p>
  </div>

  <!-- PAPER PANEL -->
  <div class="lg:col-span-3 flex items-center justify-center px-6 py-14 sm:px-10">
    <div class="w-full max-w-[380px] fade-up">
      <h2 class="font-display text-3xl text-ink">Create your account</h2>
      <p class="text-graphite text-sm mt-2 mb-8">Free to start — no credit card needed.</p>

      <form class="space-y-5">
        <div>
          <label for="name" class="block text-xs font-medium tracking-wide text-graphite mb-1.5">FULL NAME</label>
          <input id="name" type="text" placeholder="Jordan Patel" autocomplete="name"
            class="w-full bg-transparent border-b border-paperline focus:border-correction text-ink placeholder-graphitesoft py-2 text-[15px] transition-colors" />
        </div>

        <div>
          <label for="email" class="block text-xs font-medium tracking-wide text-graphite mb-1.5">EMAIL</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email"
            class="w-full bg-transparent border-b border-paperline focus:border-correction text-ink placeholder-graphitesoft py-2 text-[15px] transition-colors" />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-xs font-medium tracking-wide text-graphite">PASSWORD</label>
            <button type="button" id="togglePw" class="text-xs text-graphite hover:text-correction transition-colors">Show</button>
          </div>
          <input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password"
            class="w-full bg-transparent border-b border-paperline focus:border-correction text-ink placeholder-graphitesoft py-2 text-[15px] transition-colors" />
          <div class="flex gap-1.5 mt-2.5" id="strengthBars">
            <span class="bar h-1 flex-1 rounded-full bg-paperline"></span>
            <span class="bar h-1 flex-1 rounded-full bg-paperline"></span>
            <span class="bar h-1 flex-1 rounded-full bg-paperline"></span>
            <span class="bar h-1 flex-1 rounded-full bg-paperline"></span>
          </div>
          <p id="strengthLabel" class="text-xs text-graphitesoft mt-1.5 font-mono">&nbsp;</p>
        </div>

        <div>
          <label for="confirm" class="block text-xs font-medium tracking-wide text-graphite mb-1.5">CONFIRM PASSWORD</label>
          <input id="confirm" type="password" placeholder="Re-enter your password" autocomplete="new-password"
            class="w-full bg-transparent border-b border-paperline focus:border-correction text-ink placeholder-graphitesoft py-2 text-[15px] transition-colors" />
        </div>

        <label class="flex items-start gap-2.5 text-sm text-graphite cursor-pointer select-none pt-1">
          <input type="checkbox" class="w-4 h-4 mt-0.5 rounded-sm border-paperline text-correction focus:ring-correction accent-[#3B5BDB]" />
          <span>I agree to the <a href="#" class="text-correction hover:text-correctiondark">Terms</a> and <a href="#" class="text-correction hover:text-correctiondark">Privacy Policy</a></span>
        </label>

        <button type="submit"
          class="w-full bg-ink hover:bg-inksoft text-paper text-sm font-medium py-3 rounded-md transition-colors mt-1">
          Create account
        </button>

        <div class="flex items-center gap-3 py-1">
          <span class="h-px flex-1 bg-paperline"></span>
          <span class="text-xs text-graphitesoft font-mono">OR</span>
          <span class="h-px flex-1 bg-paperline"></span>
        </div>

        <button type="button"
          class="w-full border border-paperline hover:border-graphite text-ink text-sm font-medium py-3 rounded-md transition-colors flex items-center justify-center gap-2.5">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.85.86-3.05.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.29-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
          Continue with Google
        </button>
      </form>

      <p class="text-sm text-graphite mt-8">
        Already have an account? <a href="login.html" class="text-correction hover:text-correctiondark font-medium">Sign in</a>
      </p>
    </div>
  </div>
</div>

<script>
  const pwInput = document.getElementById('password');
  const toggle = document.getElementById('togglePw');
  toggle.addEventListener('click', () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    toggle.textContent = isPw ? 'Hide' : 'Show';
  });

  const bars = document.querySelectorAll('#strengthBars .bar');
  const label = document.getElementById('strengthLabel');
  const colors = ['#D64545', '#E0A23B', '#3B5BDB', '#3C9A5F'];
  const labels = ['Weak', 'Fair', 'Good', 'Strong'];

  pwInput.addEventListener('input', () => {
    const v = pwInput.value;
    let score = 0;
    if (v.length >= 8) score++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    bars.forEach((bar, i) => {
      bar.style.backgroundColor = (v.length > 0 && i < score) ? colors[score - 1] : '';
      if (!(v.length > 0 && i < score)) bar.classList.add('bg-paperline');
      else bar.classList.remove('bg-paperline');
    });
    label.textContent = v.length > 0 ? labels[Math.max(score - 1, 0)] : '\u00A0';
  });
</script>
</body>
</html>
