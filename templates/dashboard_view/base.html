{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}ResumeIQ{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/dashboard_style.css' %}">
</head>
<body>
<div class="app">

  {% include "dashboard_view/partials/sidebar.html" %}

  <main class="main">
    <div class="topbar">
      <div>
        <h1>{% block page_title %}{% endblock %}</h1>
        <div class="desc">{% block page_desc %}{% endblock %}</div>
      </div>
      <div class="who">
        <div class="avatar">{{ nav.avatar_initial }}</div>{{ nav.avatar_name }}
      </div>
    </div>

    {% block content %}{% endblock %}
  </main>

</div>
</body>
</html>
